[plugin]
id = "brew-hub"
name = "Brew Hub"
version = "1.1.0"
author = "madmaxgrey"
description = "A Brew Hub tab in Millennium's settings with Themes and Plugins from steambrew.app, installed in one click with Millennium's own installer."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
